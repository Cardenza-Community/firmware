; Full feature Cardenza port. Keep the existing Cardenza Launcher bootloader/table.
[env:cardenza]
extends = env:m5stack-cardputer
board_build.arduino.memory_type = qio_qspi
build_unflags =
    -DDEVICE_NAME='"M5Stack Cardputer"'
    -DANALOG_BAT_PIN
    -DHAS_RGB_LED
    -DES8311_CODEC
    -DBOARD_HAS_PSRAM
build_flags =
    ${env:m5stack-cardputer.build_flags}
    -Wl,--wrap=esp_partition_erase_range
    -DCARDENZA_TARGET=1
    -Wl,--wrap=psramInit
    -DDEVICE_NAME='"Cardenza"'

; Startup menu hardware test only; retains the full app feature code.
[env:cardenza-radio-disabled]
extends = env:cardenza
build_flags = ${env:cardenza.build_flags}
build_src_flags =
    ${env.build_src_flags}
    -DBRUCE_STARTUP_MENU_TEST=1
extra_scripts =
    ${env.extra_scripts}
    pre:support/startup_radio_guard.py
